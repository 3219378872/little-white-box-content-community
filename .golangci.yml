version: "2"

run:
  timeout: 5m
  tests: true
  concurrency: 4
  go: "1.27.0"

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - govet
    - importas
    - ineffassign
    - misspell
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    importas:
      # Logging calls read as logging.WithContext(ctx) everywhere (AGENTS.md);
      # any other alias for the shared logging package is rejected.
      alias:
        - pkg: esx/pkg/logging
          alias: logging
  exclusions:
    generated: lax
    paths:
      - ".*\\.pb\\.go$"
      - ".*_grpc\\.pb\\.go$"
      - ".*_gen\\.go$"
      # Contract-generated files (cwd-agnostic so per-module lint also matches).
      # Editing these is prohibited; they are regenerated from OpenAPI / .proto.
      # The *_handler.go files next to routes.go are hand-written and linted.
      - "(.*/)?internal/types/.*\\.go$"
      - "(.*/)?internal/handler/routes\\.go$"
      - "vendor/"
    rules:
      - path: "_test\\.go$"
        linters:
          - errcheck
        text: "Error return value.*(Close|Rollback|Remove|RemoveAll|Write|Encode|Decode|Fprint|Fprintf|Fprintln|Print|Printf|Println)"
      - path: "(.*/)?internal/handler/.*_handler\\.go$"
        linters:
          - errcheck
        text: "Error return value of `httpx\\.Parse` is not checked"
      # Project configx uses custom JSON struct tags (json:",optional", json:",default=…")
      # that staticcheck's SA5008 doesn't recognise — suppress the false positives
      # only in config structs where these tags are idiomatic.
      - path: "((.*/)?internal/config/|pkg/(configx|lifecycle|redisstore|rpcx|logging|httpx)/).*\\.go$"
        linters:
          - staticcheck
        text: "SA5008"

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - ".*\\.pb\\.go$"
      - ".*_grpc\\.pb\\.go$"
      - ".*_gen\\.go$"
      # Contract-generated files (cwd-agnostic so per-module lint also matches).
      # Editing these is prohibited; they are regenerated from OpenAPI / .proto.
      # The *_handler.go files next to routes.go are hand-written and linted.
      - "(.*/)?internal/types/.*\\.go$"
      - "(.*/)?internal/handler/routes\\.go$"
      - "vendor/"

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
