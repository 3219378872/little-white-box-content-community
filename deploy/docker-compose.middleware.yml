services:
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: xbh-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Xbh@MySQL2024!}
      MYSQL_DATABASE: xbh_user
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xbh-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: xbh-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-Xbh@Redis2024!}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Xbh@Redis2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xbh-network

  # etcd 服务注册/发现
  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: xbh-etcd
    restart: unless-stopped
    environment:
      - ETCD_DATA_DIR=/etcd
    command:
      - etcd
      - --name=default
#      - --advertise-client-urls=http://etcd:2379
      - --advertise-client-urls=http://127.0.0.1:2379
#      - --listen-client-urls=http://0.0.0.0:2379
      - --listen-client-urls=http://0.0.0.0:2379
#      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
#      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-peer-urls=http://0.0.0.0:2380
#      - --initial-cluster=default=http://etcd:2380
      - --initial-cluster=default=http://127.0.0.1:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
      - "2380:2380"
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - xbh-network

  # RocketMQ NameServer
  rocketmq-namesrv:
    image: apache/rocketmq:5.1.3
    container_name: xbh-rocketmq-namesrv
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT: "-Duser.home=/home/rocketmq"
    command: sh mqnamesrv
    volumes:
      - rocketmq_namesrv_logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9876' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - xbh-network

  # RocketMQ Broker
  rocketmq-broker:
    image: apache/rocketmq:5.1.3
    container_name: xbh-rocketmq-broker
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
      # Host cgroup v2 + JDK 8u372: StoreUtil.<clinit> NPEs in
      # CgroupV2Subsystem.getInstance, then every Pull returns
      # NoClassDefFoundError. Disable container metrics so OS MXBean works.
      JAVA_OPT_EXT: "-Duser.home=/home/rocketmq -server -Xms512m -Xmx512m -XX:-UseContainerSupport"
    command: >
      bash -c "
        chown -R rocketmq:rocketmq /home/rocketmq/store /home/rocketmq/logs &&
        su rocketmq -s /bin/bash -c '
          bash /home/rocketmq/scripts/init-topics.sh &
          sh mqbroker -c /home/rocketmq/rocketmq-5.1.3/conf/broker.conf -n rocketmq-namesrv:9876
        '
      "
    user: root
    volumes:
      - rocketmq_broker_logs:/home/rocketmq/logs
      - rocketmq_broker_store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.1.3/conf/broker.conf
      - ./rocketmq/init-topics.sh:/home/rocketmq/scripts/init-topics.sh:ro
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/10911' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - xbh-network

  # RocketMQ Console
  rocketmq-console:
    image: styletang/rocketmq-console-ng
    container_name: xbh-rocketmq-console
    restart: unless-stopped
    ports:
      - "8180:8080"
    environment:
      JAVA_OPTS: "-Drocketmq.namesrv.addr=rocketmq-namesrv:9876 -Dcom.rocketmq.sendMessageWithVIPChannel=false"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    networks:
      - xbh-network

  # Elasticsearch 搜索引擎
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.8.0
    container_name: xbh-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - xbh-network

  # Milvus 依赖的 etcd
  etcd-milvus:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: xbh-milvus-etcd
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - milvus_etcd:/etcd
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - xbh-network

  # Milvus 依赖的 MinIO（端口映射到 9100 避免与业务 MinIO 冲突）
  minio-milvus:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: xbh-milvus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - milvus_minio:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - xbh-network

  milvus:
    image: milvusdb/milvus:v2.2.8
    container_name: xbh-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd-milvus:2379
      MINIO_ADDRESS: minio-milvus:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
    depends_on:
      etcd-milvus:
        condition: service_healthy
      minio-milvus:
        condition: service_healthy
    networks:
      - xbh-network

  # MinIO 对象存储（业务使用）
  minio:
    image: minio/minio:latest
    container_name: xbh-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-Xbh@Minio2024!}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - xbh-network

  # SeaweedFS（业务对象存储，替代 MinIO）
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: xbh-seaweedfs
    restart: unless-stopped
    ports:
      - "9333:9333"
      - "8080:8080"
      - "8887:8888"
      - "8333:8333"
    command: >
      server -master -volume -filer -s3
      -s3.config=/etc/seaweedfs/s3_config.json
      -dir=/data
    volumes:
      - seaweedfs_data:/data
      - ./seaweedfs/s3_config.json:/etc/seaweedfs/s3_config.json:ro
    healthcheck:
      # localhost resolves to ::1 first inside the container, but SeaweedFS
      # only listens on IPv4; busybox wget then fails with ECONNREFUSED.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9333/cluster/status"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - xbh-network

  # Jaeger 链路追踪
  jaeger:
    image: jaegertracing/all-in-one:1.47
    container_name: xbh-jaeger
    restart: unless-stopped
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"  # UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    networks:
      - xbh-network

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: xbh-prometheus
    restart: unless-stopped
    ports:
      - "9095:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - xbh-network

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    container_name: xbh-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-Xbh@Grafana2024!}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - xbh-network

  # Loki 日志收集
  loki:
    image: grafana/loki:3.7.6
    container_name: xbh-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - xbh-network

  # ClickHouse 行为日志分析库
  clickhouse:
    image: clickhouse/clickhouse-server:23.8-alpine
    container_name: xbh-clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"
      - "9004:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./sql/xbh_analytics.sql:/docker-entrypoint-initdb.d/xbh_analytics.sql:ro
    environment:
      CLICKHOUSE_DB: xbh_analytics
      CLICKHOUSE_USER: default
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - xbh-network

  # Python algorithm services are opt-in so middleware-only development does
  # not download model artifacts or reserve inference ports.
  embedding-service:
    profiles: ["algorithm"]
    build:
      context: ../app/embedding/service
      dockerfile: Dockerfile
    container_name: xbh-embedding-service
    restart: unless-stopped
    environment:
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
      EMBEDDING_LISTEN_ADDRESS: "[::]:50051"
      EMBEDDING_MODEL_NAME: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      EMBEDDING_MODEL_REVISION: e8f8c211226b894fcb81acc59f3b34ba3efd5f42
      EMBEDDING_MODEL_VERSION: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2@e8f8c211226b894fcb81acc59f3b34ba3efd5f42
      EMBEDDING_DIMENSION: "384"
      EMBEDDING_MAX_TEXT_BYTES: "16384"
      EMBEDDING_MAX_BATCH_SIZE: "64"
      EMBEDDING_MAX_BATCH_BYTES: "262144"
      EMBEDDING_INFERENCE_BATCH_SIZE: "32"
      EMBEDDING_WORKERS: "8"
    ports:
      - "50051:50051"
    volumes:
      - embedding_model_cache:/var/lib/embedding/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import grpc, embedding_pb2, embedding_pb2_grpc; response = embedding_pb2_grpc.EmbeddingServiceStub(grpc.insecure_channel('127.0.0.1:50051')).Health(embedding_pb2.EmbeddingHealthReq(), timeout=3); raise SystemExit(0 if response.ready else 1)"
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 5m
    networks:
      - xbh-network

  online-infer:
    profiles: ["algorithm"]
    build:
      context: ..
      dockerfile: algorithm/online_infer/Dockerfile
    container_name: xbh-online-infer
    restart: unless-stopped
    environment:
      ONLINE_INFER_LISTEN: 0.0.0.0:9025
      MODEL_MANIFEST_JSON: '[{"version":"rank-v1","uri":"/models/rank-v1.json","active":true}]'
      MODEL_REGISTRY_MANIFEST_URI: ${MODEL_REGISTRY_MANIFEST_URI:-}
      MODEL_REGISTRY_VERSION: ${MODEL_REGISTRY_VERSION:-}
      MODEL_S3_ENDPOINT: ${MODEL_S3_ENDPOINT:-http://minio:9000}
      MODEL_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      MODEL_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MODEL_S3_REGION: ${MODEL_S3_REGION:-us-east-1}
      GRPC_WORKERS: "16"
      SHADOW_WORKERS: "2"
    ports:
      - "9025:9025"
    volumes:
      - ../algorithm/models:/models:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys; sys.path.insert(0, '/srv/app/algorithm/online_infer/generated'); import grpc, inference_pb2, inference_pb2_grpc; response = inference_pb2_grpc.OnlineInferServiceStub(grpc.insecure_channel('127.0.0.1:9025')).Health(inference_pb2.InferHealthReq(), timeout=3); raise SystemExit(0 if response.ready else 1)"
      interval: 15s
      timeout: 5s
      retries: 10
    networks:
      - xbh-network

  model-registry-init:
    profiles: ["training"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: xbh-model-registry-init
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set registry http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "registry/$${MODEL_REGISTRY_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MODEL_REGISTRY_BUCKET: ${MODEL_REGISTRY_BUCKET:-xbh-models}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - xbh-network

  offline-train:
    profiles: ["training"]
    build:
      context: ..
      dockerfile: algorithm/offline_train/Dockerfile
    environment:
      CLICKHOUSE_DSN: ${CLICKHOUSE_DSN:-http://clickhouse:8123/xbh_analytics}
      MODEL_REGISTRY_BUCKET: ${MODEL_REGISTRY_BUCKET:-xbh-models}
      MODEL_REGISTRY_PREFIX: ${MODEL_REGISTRY_PREFIX:-recommend-models}
      MODEL_S3_ENDPOINT: ${MODEL_S3_ENDPOINT:-http://minio:9000}
      MODEL_S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      MODEL_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MODEL_S3_REGION: ${MODEL_S3_REGION:-us-east-1}
      MODEL_TRAIN_VERSION: ${MODEL_TRAIN_VERSION:-}
      MODEL_FEATURE_START: ${MODEL_FEATURE_START:-}
      MODEL_SAMPLE_START: ${MODEL_SAMPLE_START:-}
      MODEL_SAMPLE_END: ${MODEL_SAMPLE_END:-}
      MODEL_FEATURE_VERSION: ${MODEL_FEATURE_VERSION:-v2}
      MODEL_REGISTRY_STATUS: ${MODEL_REGISTRY_STATUS:-candidate}
      MODEL_VALIDATION_FRACTION: ${MODEL_VALIDATION_FRACTION:-0.2}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        : "$${MODEL_TRAIN_VERSION:?MODEL_TRAIN_VERSION is required}"
        : "$${MODEL_FEATURE_START:?MODEL_FEATURE_START is required}"
        : "$${MODEL_SAMPLE_START:?MODEL_SAMPLE_START is required}"
        : "$${MODEL_SAMPLE_END:?MODEL_SAMPLE_END is required}"
        exec python -m algorithm.offline_train.run \
          --version "$${MODEL_TRAIN_VERSION}" \
          --feature-start "$${MODEL_FEATURE_START}" \
          --sample-start "$${MODEL_SAMPLE_START}" \
          --sample-end "$${MODEL_SAMPLE_END}" \
          --feature-version "$${MODEL_FEATURE_VERSION}" \
          --validation-fraction "$${MODEL_VALIDATION_FRACTION}" \
          --registry-status "$${MODEL_REGISTRY_STATUS}" \
          --output-dir /srv/app/artifacts
    volumes:
      - training_artifacts:/srv/app/artifacts
    depends_on:
      clickhouse:
        condition: service_healthy
      model-registry-init:
        condition: service_completed_successfully
    networks:
      - xbh-network

volumes:
  mysql_data:
  redis_data:
  etcd_data:
  rocketmq_namesrv_logs:
  rocketmq_broker_logs:
  rocketmq_broker_store:
  es_data:
  milvus_etcd:
  milvus_minio:
  milvus_data:
  minio_data:
  seaweedfs_data:
  prometheus_data:
  grafana_data:
  loki_data:
  clickhouse_data:
  embedding_model_cache:
  training_artifacts:

networks:
  xbh-network:
    driver: bridge
