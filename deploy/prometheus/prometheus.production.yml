global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: user-rpc
    static_configs:
      - targets: ["user-rpc:9190"]

  - job_name: content-rpc
    static_configs:
      - targets: ["content-rpc:9188"]

  - job_name: interaction-rpc
    static_configs:
      - targets: ["interaction-rpc:9103"]

  - job_name: behavior-rpc
    static_configs:
      - targets: ["behavior-rpc:9121"]

  - job_name: search-rpc
    static_configs:
      - targets: ["search-rpc:9122"]

  - job_name: recommend-rpc
    static_configs:
      - targets: ["recommend-rpc:9123"]

  - job_name: assistant-rpc
    static_configs:
      - targets: ["assistant-rpc:9124"]

  - job_name: behavior-log-consumer
    static_configs:
      - targets: ["behavior-log-consumer:9131"]

  - job_name: recommend-feature-consumer
    static_configs:
      - targets: ["recommend-consumer:9132"]

  - job_name: search-index-consumer
    static_configs:
      - targets: ["search-consumer:9133"]

  - job_name: embedding-index-consumer
    static_configs:
      - targets: ["embedding-consumer:9134"]

  - job_name: assistant-watch-matcher
    static_configs:
      - targets: ["assistant-watch-consumer:9135"]
