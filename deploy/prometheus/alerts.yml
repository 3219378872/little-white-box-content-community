groups:
  - name: esx-runtime
    rules:
      - alert: EsxRuntimeMetricsTargetDown
        expr: up{job=~"behavior-rpc|search-rpc|recommend-rpc|assistant-rpc|content-rpc|interaction-rpc|user-rpc|behavior-log-consumer|recommend-feature-consumer|search-index-consumer|embedding-index-consumer"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: ESX runtime metrics target is down

      - alert: RecommendPipelineDegradationRateHigh
        expr: |
          sum(rate(esx_recommend_rpc_pipeline_total{outcome=~"degraded|unavailable"}[5m]))
          /
          clamp_min(sum(rate(esx_recommend_rpc_pipeline_total[5m])), 0.001)
          > 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Recommendation pipeline degradation rate is above 10 percent

      - alert: RecommendInferenceFailureRateHigh
        expr: |
          sum(rate(esx_recommend_rpc_inference_total{outcome=~"timeout|unavailable|invalid"}[5m]))
          /
          clamp_min(sum(rate(esx_recommend_rpc_inference_total{outcome=~"success|timeout|unavailable|invalid"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Recommendation online inference failure rate is above 5 percent

      - alert: RecommendEmptyResultRateHigh
        expr: |
          sum(rate(esx_recommend_rpc_results_total{outcome="empty"}[10m]))
          /
          clamp_min(sum(rate(esx_recommend_rpc_results_total[10m])), 0.001)
          > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Recommendation empty result rate is above 10 percent

      - alert: AssistantLLMFailureRateHigh
        expr: |
          sum(rate(esx_assistant_rpc_llm_calls_total{outcome="failure"}[5m]))
          /
          clamp_min(sum(rate(esx_assistant_rpc_llm_calls_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Assistant LLM failure rate is above 5 percent

      - alert: AssistantToolFailureRateHigh
        expr: |
          sum(rate(esx_assistant_rpc_tool_calls_total{outcome=~"timeout|unavailable|empty_result"}[5m]))
          /
          clamp_min(sum(rate(esx_assistant_rpc_tool_calls_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Assistant tool failure rate is above 5 percent

      - alert: AssistantFirstTokenP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(esx_assistant_rpc_first_token_seconds_bucket[5m]))
          ) > 2
          and sum(rate(esx_assistant_rpc_first_token_seconds_count[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Assistant first token p95 is above 2 seconds

      - alert: OutboxBacklogHigh
        expr: max by (service) (esx_outbox_backlog_count) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Transactional outbox backlog is above 1000 events

      - alert: OutboxOldestEventTooOld
        expr: max by (service) (esx_outbox_oldest_age_seconds) > 300
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Oldest transactional outbox event is more than 5 minutes old

      - alert: OutboxBacklogCollectionFailing
        expr: sum by (service) (increase(esx_outbox_backlog_collections_total{outcome="failure"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Transactional outbox backlog collection is failing

      - alert: BehaviorConsumerRetrying
        expr: sum(increase(esx_behavior_log_consumer_messages_total{outcome="retry"}[5m])) > 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Behavior log consumer is retrying messages

      - alert: BehaviorMQPublishFailureRateHigh
        expr: |
          sum(rate(esx_behavior_rpc_mq_publish_total{outcome="failure"}[5m]))
          /
          clamp_min(sum(rate(esx_behavior_rpc_mq_publish_total[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Behavior RPC MQ publish failure rate is above 5 percent

      - alert: BehaviorDeadLettersDetected
        expr: sum(increase(esx_behavior_log_consumer_messages_total{outcome="dead_letter"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: Behavior log consumer recorded permanent dead letters

      - alert: ClickHouseBehaviorWriteP95High
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(esx_behavior_log_store_write_seconds_bucket{operation="behavior"}[5m]))
          ) > 1
          and sum(rate(esx_behavior_log_store_write_seconds_count{operation="behavior"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: ClickHouse behavior write p95 is above one second

      - alert: RecommendFeatureFreshnessHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(esx_recommend_feature_consumer_event_lag_seconds_bucket{stream="behavior"}[5m]))
          ) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Recommendation feature update p95 lag is above one minute

      - alert: SearchIndexFreshnessHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(esx_search_index_consumer_event_lag_seconds_bucket[5m]))
          ) > 60
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Elasticsearch index update p95 lag is above one minute

      - alert: EmbeddingIndexFreshnessHigh
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(esx_embedding_index_consumer_event_lag_seconds_bucket[5m]))
          ) > 300
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Milvus embedding update p95 lag is above five minutes
