x-go-build: &go-build
  context: ..
  dockerfile: deploy/Dockerfile.service

x-go-service: &go-service
  profiles: ["production"]
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  networks:
    - xbh-network

x-process-healthcheck: &process-healthcheck
  test: ["CMD-SHELL", "kill -0 1"]
  interval: 15s
  timeout: 5s
  retries: 3
  start_period: 10s

x-etcd-env: &etcd-env
  ETCD_ENDPOINT: etcd:2379

x-redis-env: &redis-env
  REDIS_HOST: redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

x-mq-env: &mq-env
  MQ_NAMESERVER: rocketmq-namesrv:9876

x-es-env: &es-env
  ES_ADDRESS: http://elasticsearch:9200
  ES_USERNAME: ${ES_USERNAME:-}
  ES_PASSWORD: ${ES_PASSWORD:-}

x-milvus-env: &milvus-env
  MILVUS_ADDRESS: milvus:19530
  MILVUS_USERNAME: ${MILVUS_USERNAME:-}
  MILVUS_PASSWORD: ${MILVUS_PASSWORD:-}
  MILVUS_DATABASE: ${MILVUS_DATABASE:-default}

x-s3-env: &s3-env
  S3_ENDPOINT: seaweedfs:8333
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:?S3_PUBLIC_BASE_URL is required}

x-core-dependencies: &core-dependencies
  mysql:
    condition: service_healthy
  redis:
    condition: service_healthy
  etcd:
    condition: service_healthy
  rocketmq-broker:
    condition: service_healthy

x-gateway-dependencies: &gateway-dependencies
  user-rpc:
    condition: service_healthy
  content-rpc:
    condition: service_healthy
  media-rpc:
    condition: service_healthy
  interaction-rpc:
    condition: service_healthy
  feed-rpc:
    condition: service_healthy
  message-rpc:
    condition: service_healthy
  behavior-rpc:
    condition: service_healthy
  search-rpc:
    condition: service_healthy
  recommend-rpc:
    condition: service_healthy
  assistant-rpc:
    condition: service_healthy

x-gateway: &gateway
  <<: *go-service
  image: xbh/gateway:${IMAGE_TAG:-local}
  build:
    <<: *go-build
    args:
      SERVICE_PATH: app/gateway
      SERVICE_CONFIG: app/gateway/etc/gateway.yaml
  environment:
    <<: *etcd-env
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
    RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
  expose:
    - "8888"
  healthcheck:
    test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8888/api/v1/health"]
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 10s
  depends_on:
    <<: *gateway-dependencies

services:
  # Development keeps the defaults in docker-compose.middleware.yml. The
  # production overlay requires operators to inject every middleware secret.
  mysql:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-milvus:
    environment:
      MINIO_ROOT_USER: ${MILVUS_MINIO_ROOT_USER:?MILVUS_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MILVUS_MINIO_ROOT_PASSWORD:?MILVUS_MINIO_ROOT_PASSWORD is required}

  milvus:
    environment:
      MINIO_ACCESS_KEY_ID: ${MILVUS_MINIO_ROOT_USER:?MILVUS_MINIO_ROOT_USER is required}
      MINIO_SECRET_ACCESS_KEY: ${MILVUS_MINIO_ROOT_PASSWORD:?MILVUS_MINIO_ROOT_PASSWORD is required}

  minio:
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}

  seaweedfs:
    entrypoint: ["/bin/sh", "/opt/xbh/render-config.sh"]
    command:
      - server
      - -master
      - -volume
      - -filer
      - -s3
      - -s3.config=/tmp/s3_config.json
      - -dir=/data
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - ./seaweedfs/render-config.sh:/opt/xbh/render-config.sh:ro

  grafana:
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?GRAFANA_PASSWORD is required}

  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.production.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.production.yml:/etc/prometheus/prometheus.production.yml:ro

  embedding-service:
    profiles: ["production"]

  online-infer:
    profiles: ["production"]
    environment:
      MODEL_MANIFEST_JSON: '[]'
      MODEL_TRAFFIC_JSON: '{}'
      MODEL_REGISTRY_MANIFEST_URI: ${MODEL_REGISTRY_MANIFEST_URI:?MODEL_REGISTRY_MANIFEST_URI is required}
      MODEL_REGISTRY_VERSION: ${MODEL_REGISTRY_VERSION:-}
      MODEL_S3_ENDPOINT: ${MODEL_S3_ENDPOINT:-http://minio:9000}
      MODEL_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MODEL_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MODEL_S3_REGION: ${MODEL_S3_REGION:-us-east-1}

  user-rpc:
    <<: *go-service
    image: xbh/user-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/user/rpc
        SERVICE_CONFIG: app/user/rpc/etc/user.yaml
    environment:
      <<: [*etcd-env, *redis-env, *mq-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
    expose: ["9090", "9190"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9090"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      <<: *core-dependencies

  content-rpc:
    <<: *go-service
    image: xbh/content-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/content/rpc
        SERVICE_CONFIG: app/content/rpc/etc/content.yaml
    environment:
      <<: [*etcd-env, *redis-env, *mq-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      DB_CONTENT: ${DB_CONTENT:?DB_CONTENT is required}
    expose: ["8088", "9188"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8088"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      <<: *core-dependencies

  media-rpc:
    <<: *go-service
    image: xbh/media-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/media/rpc
        SERVICE_CONFIG: app/media/rpc/etc/media.yaml
    environment:
      <<: [*etcd-env, *redis-env, *mq-env, *s3-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      DB_MEDIA: ${DB_MEDIA:?DB_MEDIA is required}
    expose: ["9008"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9008"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      <<: *core-dependencies
      seaweedfs:
        condition: service_healthy

  interaction-rpc:
    <<: *go-service
    image: xbh/interaction-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/interaction/rpc
        SERVICE_CONFIG: app/interaction/rpc/etc/interaction.yaml
    environment:
      <<: [*etcd-env, *redis-env, *mq-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      DB_INTERACTION: ${DB_INTERACTION:?DB_INTERACTION is required}
    expose: ["9003", "9103"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9003"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      <<: *core-dependencies

  feed-rpc:
    <<: *go-service
    image: xbh/feed-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/feed/rpc
        SERVICE_CONFIG: app/feed/rpc/etc/feed.yaml
    environment:
      <<: [*etcd-env, *redis-env, *mq-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      DB_FEED: ${DB_FEED:?DB_FEED is required}
      FEED_CURSOR_SECRET: ${FEED_CURSOR_SECRET:?FEED_CURSOR_SECRET is required}
    expose: ["9093"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9093"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      <<: *core-dependencies
      user-rpc:
        condition: service_healthy
      content-rpc:
        condition: service_healthy
      recommend-rpc:
        condition: service_healthy

  message-rpc:
    <<: *go-service
    image: xbh/message-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/message/rpc
        SERVICE_CONFIG: app/message/rpc/etc/message.yaml
    environment:
      <<: [*etcd-env, *redis-env, *mq-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      DB_MESSAGE: ${DB_MESSAGE:?DB_MESSAGE is required}
    expose: ["9092"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9092"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      <<: *core-dependencies
      user-rpc:
        condition: service_healthy

  behavior-rpc:
    <<: *go-service
    image: xbh/behavior-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/behavior/rpc
        SERVICE_CONFIG: app/behavior/rpc/etc/behavior.yaml
    environment:
      <<: [*etcd-env, *mq-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
    expose: ["9021", "9121"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9021"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      etcd:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy

  search-rpc:
    <<: *go-service
    image: xbh/search-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/search/rpc
        SERVICE_CONFIG: app/search/rpc/etc/search.yaml
    environment:
      <<: [*etcd-env, *es-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
    expose: ["9022", "9122"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9022"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      etcd:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      user-rpc:
        condition: service_healthy

  recommend-rpc:
    <<: *go-service
    image: xbh/recommend-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/recommend/rpc
        SERVICE_CONFIG: app/recommend/rpc/etc/recommend.yaml
    environment:
      <<: [*etcd-env, *redis-env, *es-env, *milvus-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      ONLINE_INFER_ENDPOINT: online-infer:9025
      RECOMMEND_CURSOR_SECRET: ${RECOMMEND_CURSOR_SECRET:?RECOMMEND_CURSOR_SECRET is required}
    expose: ["9023", "9123"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9023"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      milvus:
        condition: service_healthy
      online-infer:
        condition: service_healthy
      user-rpc:
        condition: service_healthy
      content-rpc:
        condition: service_healthy

  assistant-rpc:
    <<: *go-service
    image: xbh/assistant-rpc:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/assistant/rpc
        SERVICE_CONFIG: app/assistant/rpc/etc/assistant.yaml
    environment:
      <<: [*etcd-env, *redis-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      DB_ASSISTANT: ${DB_ASSISTANT:?DB_ASSISTANT is required}
    expose: ["9024", "9124"]
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9024"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    depends_on:
      etcd:
        condition: service_healthy
      redis:
        condition: service_healthy
      search-rpc:
        condition: service_healthy
      recommend-rpc:
        condition: service_healthy
      content-rpc:
        condition: service_healthy
      user-rpc:
        condition: service_healthy

  feed-consumer:
    <<: *go-service
    image: xbh/feed-consumer:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/feed/mq
        SERVICE_CONFIG: app/feed/mq/etc/feed-consumer.yaml
    environment:
      <<: [*etcd-env, *mq-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      DB_FEED: ${DB_FEED:?DB_FEED is required}
    healthcheck: *process-healthcheck
    depends_on:
      mysql:
        condition: service_healthy
      etcd:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      user-rpc:
        condition: service_healthy

  media-consumer:
    <<: *go-service
    image: xbh/media-consumer:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/media/mq
        SERVICE_CONFIG: app/media/mq/etc/media-consumer.yaml
    environment:
      <<: [*mq-env, *s3-env]
    healthcheck: *process-healthcheck
    depends_on:
      rocketmq-broker:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  behavior-log-consumer:
    <<: *go-service
    image: xbh/behavior-log-consumer:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/pipeline/behaviorlog
        SERVICE_CONFIG: app/pipeline/behaviorlog/etc/behavior-log.yaml
    environment:
      <<: [*redis-env, *mq-env]
      CLICKHOUSE_DSN: ${CLICKHOUSE_DSN:-clickhouse://clickhouse:9000/xbh_analytics}
    healthcheck: *process-healthcheck
    depends_on:
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy

  recommend-consumer:
    <<: *go-service
    image: xbh/recommend-consumer:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/recommend/mq
        SERVICE_CONFIG: app/recommend/mq/etc/recommend-consumer.yaml
    environment:
      <<: [*redis-env, *mq-env]
    healthcheck: *process-healthcheck
    depends_on:
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy

  search-consumer:
    <<: *go-service
    image: xbh/search-consumer:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/search/mq
        SERVICE_CONFIG: app/search/mq/etc/search-consumer.yaml
    environment:
      <<: [*etcd-env, *mq-env, *es-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
    healthcheck: *process-healthcheck
    depends_on:
      etcd:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      content-rpc:
        condition: service_healthy

  embedding-consumer:
    <<: *go-service
    image: xbh/embedding-consumer:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/embedding/mq
        SERVICE_CONFIG: app/embedding/mq/etc/embedding-consumer.yaml
    environment:
      <<: [*etcd-env, *mq-env, *milvus-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      EMBEDDING_GRPC_ADDRESS: embedding-service:50051
      EMBEDDING_MODEL_VERSION: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2@e8f8c211226b894fcb81acc59f3b34ba3efd5f42
    healthcheck: *process-healthcheck
    depends_on:
      etcd:
        condition: service_healthy
      milvus:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      embedding-service:
        condition: service_healthy
      content-rpc:
        condition: service_healthy

  content-cleanup-consumer:
    <<: *go-service
    image: xbh/content-cleanup-consumer:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/content/mq/cleanup
        SERVICE_CONFIG: app/content/mq/cleanup/etc/content-cleanup.yaml
    environment:
      <<: [*redis-env, *mq-env]
      DB_CONTENT: ${DB_CONTENT:?DB_CONTENT is required}
    healthcheck: *process-healthcheck
    depends_on:
      redis:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy

  assistant-watch-consumer:
    <<: *go-service
    image: xbh/assistant-watch-consumer:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/assistant/mq
        SERVICE_CONFIG: app/assistant/mq/etc/watch-consumer.yaml
    environment:
      <<: [*etcd-env, *mq-env]
      DB_ASSISTANT: ${DB_ASSISTANT:?DB_ASSISTANT is required}
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
    expose: ["9135"]
    healthcheck: *process-healthcheck
    depends_on:
      mysql:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      content-rpc:
        condition: service_healthy

  assistant-agent:
    <<: *go-service
    image: xbh/assistant-agent:${IMAGE_TAG:-local}
    build:
      <<: *go-build
      args:
        SERVICE_PATH: app/assistant/worker
        SERVICE_CONFIG: app/assistant/worker/etc/agent.yaml
    environment:
      <<: [*etcd-env, *redis-env, *es-env]
      RPC_INTERNAL_SECRET: ${RPC_INTERNAL_SECRET:?RPC_INTERNAL_SECRET is required}
      DB_ASSISTANT: ${DB_ASSISTANT:?DB_ASSISTANT is required}
      ASSISTANT_LLM_ENABLED: ${ASSISTANT_LLM_ENABLED:-false}
      ASSISTANT_LLM_WIRE_API: ${ASSISTANT_LLM_WIRE_API:-responses}
      ASSISTANT_LLM_ENDPOINT: ${ASSISTANT_LLM_ENDPOINT:-}
      ASSISTANT_LLM_API_KEY: ${ASSISTANT_LLM_API_KEY:-}
      ASSISTANT_LLM_MODEL: ${ASSISTANT_LLM_MODEL:-}
      ASSISTANT_LLM_MODEL_SMALL: ${ASSISTANT_LLM_MODEL_SMALL:-}
      ASSISTANT_LLM_REVIEW_MODEL: ${ASSISTANT_LLM_REVIEW_MODEL:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      ASSISTANT_LLM_PROMPT_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_PROMPT_COST_PER_MILLION_TOKENS:-0}
      ASSISTANT_LLM_COMPLETION_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_COMPLETION_COST_PER_MILLION_TOKENS:-0}
      ASSISTANT_LLM_CACHE_READ_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_CACHE_READ_COST_PER_MILLION_TOKENS:-0}
      ASSISTANT_LLM_CACHE_WRITE_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_CACHE_WRITE_COST_PER_MILLION_TOKENS:-0}
      ASSISTANT_LLM_REASONING_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_REASONING_COST_PER_MILLION_TOKENS:-0}
      ASSISTANT_LLM_FALLBACK_ENABLED: ${ASSISTANT_LLM_FALLBACK_ENABLED:-false}
      ASSISTANT_LLM_FALLBACK_ROUTE_ID: ${ASSISTANT_LLM_FALLBACK_ROUTE_ID:-fallback}
      ASSISTANT_LLM_FALLBACK_BOUNDARY: ${ASSISTANT_LLM_FALLBACK_BOUNDARY:-default}
      ASSISTANT_LLM_FALLBACK_WIRE_API: ${ASSISTANT_LLM_FALLBACK_WIRE_API:-responses}
      ASSISTANT_LLM_FALLBACK_ENDPOINT: ${ASSISTANT_LLM_FALLBACK_ENDPOINT:-}
      ASSISTANT_LLM_FALLBACK_API_KEY: ${ASSISTANT_LLM_FALLBACK_API_KEY:-}
      ASSISTANT_LLM_FALLBACK_MODEL: ${ASSISTANT_LLM_FALLBACK_MODEL:-}
      ASSISTANT_LLM_FALLBACK_PROMPT_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_FALLBACK_PROMPT_COST_PER_MILLION_TOKENS:-0}
      ASSISTANT_LLM_FALLBACK_COMPLETION_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_FALLBACK_COMPLETION_COST_PER_MILLION_TOKENS:-0}
      ASSISTANT_LLM_FALLBACK_CACHE_READ_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_FALLBACK_CACHE_READ_COST_PER_MILLION_TOKENS:-0}
      ASSISTANT_LLM_FALLBACK_CACHE_WRITE_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_FALLBACK_CACHE_WRITE_COST_PER_MILLION_TOKENS:-0}
      ASSISTANT_LLM_FALLBACK_REASONING_COST_PER_MILLION_TOKENS: ${ASSISTANT_LLM_FALLBACK_REASONING_COST_PER_MILLION_TOKENS:-0}
    expose: ["9136"]
    healthcheck: *process-healthcheck
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      etcd:
        condition: service_healthy
      assistant-rpc:
        condition: service_healthy
      search-rpc:
        condition: service_healthy
      content-rpc:
        condition: service_healthy
      user-rpc:
        condition: service_healthy

  gateway-a:
    <<: *gateway

  gateway-b:
    <<: *gateway

  nginx:
    profiles: ["production"]
    image: ${NGINX_IMAGE:-nginx:alpine}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ${TLS_CERT_FILE:?TLS_CERT_FILE is required}
        target: /etc/nginx/tls/tls.crt
        read_only: true
      - type: bind
        source: ${TLS_KEY_FILE:?TLS_KEY_FILE is required}
        target: /etc/nginx/tls/tls.key
        read_only: true
      - type: bind
        source: ${STATIC_ROOT:?STATIC_ROOT is required}
        target: /srv/www
        read_only: true
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/rotate-access-log.sh:/usr/local/bin/rotate-access-log.sh:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "0 0 * * * /usr/local/bin/rotate-access-log.sh" > /etc/crontabs/root
        crond -b
        exec /docker-entrypoint.sh nginx -g "daemon off;"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      gateway-a:
        condition: service_healthy
      gateway-b:
        condition: service_healthy
    networks:
      - xbh-network
