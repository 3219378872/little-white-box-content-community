syntax = "proto3";

package assistant;
option go_package = "xiaobaihe/assistant/pb";

service AssistantService {
  rpc GetThread(GetThreadReq) returns (GetThreadResp);
  rpc ListMessages(ListMessagesReq) returns (ListMessagesResp);
  rpc PostMessage(PostMessageReq) returns (PostMessageResp);
  rpc MarkThreadRead(MarkThreadReadReq) returns (MarkThreadReadResp);
  rpc DeleteHistory(DeleteHistoryReq) returns (DeleteHistoryResp);

  rpc SubscribeRunEvents(SubscribeRunEventsReq) returns (stream RunEvent);
  rpc CancelRun(CancelRunReq) returns (CancelRunResp);
  rpc RevokeConsent(RevokeConsentReq) returns (RevokeConsentResp);
  rpc ConfirmRunTool(ConfirmRunToolReq) returns (ConfirmRunToolResp);

  rpc ListMemory(ListMemoryReq) returns (ListMemoryResp);
  rpc AddMemory(AddMemoryReq) returns (AddMemoryResp);
  rpc ReplaceMemory(ReplaceMemoryReq) returns (ReplaceMemoryResp);
  rpc RemoveMemory(RemoveMemoryReq) returns (RemoveMemoryResp);
  rpc BatchMemory(BatchMemoryReq) returns (BatchMemoryResp);
  rpc UndoMemoryChange(UndoMemoryChangeReq) returns (UndoMemoryChangeResp);

  rpc ListWatchTasks(ListWatchTasksReq) returns (ListWatchTasksResp);
  rpc CreateWatchTask(CreateWatchTaskReq) returns (CreateWatchTaskResp);
  rpc UpdateWatchTask(UpdateWatchTaskReq) returns (UpdateWatchTaskResp);
  rpc DeleteWatchTask(DeleteWatchTaskReq) returns (DeleteWatchTaskResp);

  rpc SubmitRecommendFeedback(SubmitRecommendFeedbackReq) returns (SubmitRecommendFeedbackResp);
}

message GetThreadReq {
  int64 user_id = 1;
}

message AssistantThread {
  int64 session_id = 1;
  int32 unread_count = 2;
  int64 last_message_id = 3;
  string last_message_preview = 4;
  int64 last_message_at_ms = 5;
  int64 active_run_id = 6;
  string active_run_status = 7;
  string active_run_phase = 8;
}

message GetThreadResp {
  AssistantThread thread = 1;
}

message ListMessagesReq {
  int64 user_id = 1;
  int64 session_id = 2;
  int64 after_id = 3;
  int32 limit = 4;
  int64 before_id = 5;
}

message AssistantMessage {
  int64 id = 1;
  int64 session_id = 2;
  int64 run_id = 3;
  string role = 4;
  string kind = 5;
  string content = 6;
  bool unread = 7;
  int64 created_at_ms = 8;
  int64 change_id = 9;
}

message ListMessagesResp {
  repeated AssistantMessage messages = 1;
  bool has_more = 2;
  int64 next_before_id = 3;
}

message Attachment {
  int64 media_id = 1;
  string url = 2;
}

message PostMessageReq {
  int64 user_id = 1;
  string message = 2;
  string request_id = 3;
  repeated Attachment attachments = 4;
  int64 context_post_id = 5;
}

message PostMessageResp {
  int64 message_id = 1;
  int64 session_id = 2;
  int64 run_id = 3;
  string disposition = 4;
}

message MarkThreadReadReq {
  int64 user_id = 1;
}

message MarkThreadReadResp {
  int32 unread_count = 1;
}

message DeleteHistoryReq {
  int64 user_id = 1;
}

message DeleteHistoryResp {}

message SubscribeRunEventsReq {
  int64 user_id = 1;
  int64 run_id = 2;
  int64 after_seq = 3;
}

message ToolCallInfo {
  string call_id = 1;
  string tool = 2;
  string summary = 3;
  string payload_json = 4;
}

message SourceCard {
  string handle = 1;
  string kind = 2;
  string authority_id = 3;
  string title = 4;
  int64 revision = 5;
  string payload_json = 6;
}

message RunEvent {
  int64 run_id = 1;
  int64 seq = 2;
  string type = 3;
  string text = 4;
  bool degraded = 5;
  string error_code = 6;
  int64 session_id = 7;
  ToolCallInfo tool_call = 8;
  SourceCard source_card = 9;
  int64 change_id = 10;
  string stream_id = 11;
}

message CancelRunReq {
  int64 user_id = 1;
  int64 run_id = 2;
}

message CancelRunResp {}

message RevokeConsentReq {
  int64 user_id = 1;
}

message RevokeConsentResp {}

message ConfirmRunToolReq {
  int64 user_id = 1;
  int64 run_id = 2;
  string call_id = 3;
  bool approved = 4;
}

message ConfirmRunToolResp {}

message MemoryEntry {
  int64 id = 1;
  string target = 2;
  string content = 3;
  int32 version = 4;
  int64 created_at_ms = 5;
  int64 updated_at_ms = 6;
}

message MemoryCapacity {
  string target = 1;
  int32 used = 2;
  int32 limit = 3;
}

message ListMemoryReq {
  int64 user_id = 1;
  string target = 2;
}

message ListMemoryResp {
  repeated MemoryEntry items = 1;
  repeated MemoryCapacity capacities = 2;
}

message AddMemoryReq {
  int64 user_id = 1;
  string target = 2;
  string content = 3;
  string request_id = 4;
}

message AddMemoryResp {
  MemoryEntry entry = 1;
  int64 change_id = 2;
}

message ReplaceMemoryReq {
  int64 user_id = 1;
  int64 id = 2;
  string content = 3;
  int32 version = 4;
  string request_id = 5;
}

message ReplaceMemoryResp {
  MemoryEntry entry = 1;
  int64 change_id = 2;
}

message RemoveMemoryReq {
  int64 user_id = 1;
  int64 id = 2;
  int32 version = 3;
  string request_id = 4;
}

message RemoveMemoryResp {
  int64 change_id = 1;
}

message MemoryOp {
  string op = 1;
  int64 id = 2;
  string target = 3;
  string content = 4;
  int32 version = 5;
}

message BatchMemoryReq {
  int64 user_id = 1;
  string request_id = 2;
  repeated MemoryOp ops = 3;
}

message BatchMemoryResp {
  repeated MemoryEntry entries = 1;
  repeated int64 change_ids = 2;
}

message UndoMemoryChangeReq {
  int64 user_id = 1;
  int64 change_id = 2;
}

message UndoMemoryChangeResp {
  MemoryEntry entry = 1;
}

message WatchTask {
  int64 id = 1;
  string condition_type = 2;
  string target_type = 3;
  int64 target_id = 4;
  string target_text = 5;
  bool enabled = 6;
  int32 version = 7;
  int64 created_at = 8;
}

message ListWatchTasksReq {
  int64 user_id = 1;
}

message ListWatchTasksResp {
  repeated WatchTask tasks = 1;
}

message CreateWatchTaskReq {
  int64 user_id = 1;
  string condition_type = 2;
  string target_type = 3;
  int64 target_id = 4;
  string target_text = 5;
}

message CreateWatchTaskResp {
  WatchTask task = 1;
}

message UpdateWatchTaskReq {
  int64 user_id = 1;
  int64 id = 2;
  bool enabled = 3;
  int32 expected_version = 4;
}

message UpdateWatchTaskResp {
  WatchTask task = 1;
}

message DeleteWatchTaskReq {
  int64 user_id = 1;
  int64 id = 2;
  int32 expected_version = 3;
}

message DeleteWatchTaskResp {}

message SubmitRecommendFeedbackReq {
  int64 user_id = 1;
  string request_id = 2;
  int64 post_id = 3;
  string reason = 4;
}

message SubmitRecommendFeedbackResp {}
