syntax = "proto3";

package assistant;
option go_package = "xiaobaihe/assistant/pb";

service AssistantService {
  rpc Chat(ChatReq) returns (stream ChatEvent);
  // Agent 模式高危操作确认回调（AGNT-020~022）
  rpc ConfirmToolCall(ConfirmToolCallReq) returns (ConfirmToolCallResp);
}

// 助手模式（AGNT-001）：缺省或无法识别的值按 enhanced_search 处理
enum AssistantMode {
  ASSISTANT_MODE_UNSPECIFIED = 0;
  ASSISTANT_MODE_ENHANCED_SEARCH = 1;
  ASSISTANT_MODE_AGENT = 2;
}

message ChatReq {
  int64 user_id = 1;
  string conversation_id = 2;
  string message = 3;
  string request_id = 4;
  AssistantMode mode = 5;
  // 当前会话上传的图片附件，仅 agent 模式写帖工具可引用（AGNT-013/040）
  repeated Attachment attachments = 6;
}

message Attachment {
  int64 media_id = 1;
  string url = 2;
}

message ConfirmToolCallReq {
  int64 user_id = 1;
  string request_id = 2;
  string call_id = 3;
  bool approved = 4;
}

message ConfirmToolCallResp {}

enum ChatEventType {
  CHAT_EVENT_TYPE_UNSPECIFIED = 0;
  CHAT_EVENT_TYPE_TOKEN = 1;
  CHAT_EVENT_TYPE_SOURCE = 2;
  CHAT_EVENT_TYPE_DONE = 3;
  CHAT_EVENT_TYPE_ERROR = 4;
  // agent 工具调用进度与高危确认请求（AGNT-060）
  CHAT_EVENT_TYPE_TOOL_CALL = 5;
  CHAT_EVENT_TYPE_CONFIRM_REQUIRED = 6;
}

message SourceReference {
  string source_type = 1;
  string source_id = 2;
  string title = 3;
  int64  revision = 4;
}

message ToolCallInfo {
  string call_id = 1;      // 确认回传凭据，一次性绑定请求与调用（AGNT-022）
  string tool = 2;         // search_posts|web_search|create_post|update_post|delete_post
  string summary = 3;      // 人可读摘要，客户端直接渲染
  string payload_json = 4; // 参数摘要 JSON
}

message ChatEvent {
  ChatEventType type = 1;
  string text = 2;
  SourceReference source = 3;
  bool degraded = 4;
  string error_code = 5;
  string conversation_id = 6;
  ToolCallInfo tool_call = 7;
}
