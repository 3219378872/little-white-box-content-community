syntax = "proto3";

package recommend;
option go_package = "xiaobaihe/recommend/pb";

// RecommendService only serves online recommendation traffic. Behavior writes
// are accepted by BehaviorService and delivered over user-behavior-v2.
service RecommendService {
  rpc GetRecommendPosts(GetRecommendPostsReq) returns (GetRecommendPostsResp);
  rpc GetSimilarPosts(GetSimilarPostsReq) returns (GetSimilarPostsResp);
  rpc GetRecommendUsers(GetRecommendUsersReq) returns (GetRecommendUsersResp);
}

message GetRecommendPostsReq {
  int64 user_id = 1;
  string anonymous_id = 2;
  string scene = 3;
  string request_id = 4;
  string session_id = 5;
  string cursor = 6;
  int32 page_size = 7;
  string experiment_id = 8;
}

message RecommendPost {
  int64 post_id = 1;
  double score = 2;
  string reason = 3;
  string recall_source = 4;
  string model_version = 5;
  string experiment_id = 6;
  int32 position = 7;
}

message GetRecommendPostsResp {
  repeated RecommendPost posts = 1;
  string next_cursor = 2;
  bool has_more = 3;
  string request_id = 4;
}

message GetSimilarPostsReq {
  int64 post_id = 1;
  int32 limit = 2;
  string scene = 3;
  string request_id = 4;
  string experiment_id = 5;
}

message GetSimilarPostsResp {
  repeated RecommendPost posts = 1;
  string request_id = 2;
}

message GetRecommendUsersReq {
  int64 user_id = 1;
  string anonymous_id = 2;
  string scene = 3;
  string request_id = 4;
  int32 limit = 5;
  string experiment_id = 6;
}

message RecommendUser {
  int64 user_id = 1;
  double score = 2;
  string reason = 3;
  string recall_source = 4;
  string model_version = 5;
  string experiment_id = 6;
  int32 position = 7;
}

message GetRecommendUsersResp {
  repeated RecommendUser users = 1;
  string request_id = 2;
}
