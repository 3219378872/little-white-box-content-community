Name: ad-decision-consumer
Prometheus:
  Host: 0.0.0.0
  Port: 9138
  Path: /metrics

MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "ad-decision-group"
  Topic: "review-decided"
  Tag: "ad_creative || advertiser_qualification"
  ConsumeOrder: false
  MaxReconsumeTimes: 8

DataSource: "${DB_AD}"
Redis:
  Host: 127.0.0.1:6379
  Pass: "${REDIS_PASSWORD}"
  Type: node
ReviewRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: review.rpc
Assets:
  Endpoint: "127.0.0.1:8333"
  AccessKey: "${S3_ACCESS_KEY}"
  SecretKey: "${S3_SECRET_KEY}"
  UseSSL: false
  Region: "us-east-1"
  PrivateBucket: "xbh-ad-private"
  PublicBucket: "xbh-media"
  PublicBaseURL: "http://127.0.0.1:8333/xbh-media"
ReconcileIntervalMs: 60000
RebuildIntervalMs: 300000

# 服务间内部鉴权共享密钥（HMAC），全服务一致
InternalSecret: ${RPC_INTERNAL_SECRET}
