Name: user.rpc
ListenOn: 0.0.0.0:9090
Middlewares:
  StatConf:
    # REL-022：不记录密码、手机号、验证码等敏感认证/资料字段。
    IgnoreContentMethods:
      - /user.UserService/Register
      - /user.UserService/Login
      - /user.UserService/SendVerifyCode
      - /user.UserService/UpdateProfile
      - /user.UserService/SetPersonalizationPreference
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9190
  EnableMetrics: true
  EnablePprof: false
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: user.rpc
Redis:
  Host: 127.0.0.1:6379
  Pass: "${REDIS_PASS}"
  Type: node
  Key: user

JwtConfig:
  AccessSecret: ${JWT_SECRET_KEY}
  AccessExpire: 86400

DataSource: "${DB_USER}"
MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "user-outbox-producer"
  Retry: 3
  SendTimeout: 3000
Outbox:
  BatchSize: 100
  PollIntervalMs: 200
  LeaseMs: 30000
  BaseBackoffMs: 1000
  MaxBackoffMs: 60000
  MaxAttempts: 20

# 服务间内部鉴权共享密钥（HMAC），全服务一致
InternalSecret: ${RPC_INTERNAL_SECRET}
