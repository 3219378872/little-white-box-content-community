Name: behavior.rpc
ListenOn: 0.0.0.0:9021
Health: true
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9121
  EnableMetrics: true
  EnablePprof: false
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: behavior.rpc
MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: behavior-producer-group
  Retry: 2
  SendTimeout: 3000
MaxBatchSize: 100
MaxPastAgeHours: 720
MaxFutureSkewSeconds: 300
