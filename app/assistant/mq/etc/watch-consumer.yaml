Name: assistant-watch-matcher
Prometheus:
  Host: 0.0.0.0
  Port: 9135
  Path: /metrics

MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "assistant-watch-matcher-group"
  Topic: "post-create"
  Tag: "default"
  ConsumeOrder: false
  MaxReconsumeTimes: 8

DataSource: "${DB_ASSISTANT}"
SpikeMinComments: 5
ContentRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: content.rpc
InternalSecret: ${RPC_INTERNAL_SECRET}
