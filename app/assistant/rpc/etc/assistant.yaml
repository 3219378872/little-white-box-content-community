Name: assistant.rpc
ListenOn: 0.0.0.0:9024
Health: true
Middlewares:
  StatConf:
    # REL-022：不记录 Assistant 全量输入/事件内容。
    IgnoreContentMethods:
      - /assistant.AssistantService/PostMessage
      - /assistant.AssistantService/SubscribeRunEvents
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9124
  EnableMetrics: true
  EnablePprof: false
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: assistant.rpc
SearchRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: search.rpc
ContentRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: content.rpc
MediaRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: media.rpc
RecommendRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: recommend.rpc
InteractionRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: interaction.rpc
UserRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: user.rpc
DataSource: "${DB_ASSISTANT}"
Redis:
  Host: "${REDIS_HOST}"
  Type: node
  Pass: "${REDIS_PASSWORD}"
  Key: assistant
MaxMessageRunes: 2000
QuotaWindowSeconds: 60
QuotaRequests: 20
Safety:
  Enabled: true
  MaxScanRunes: 10000
  BlockedTerms:
  - "build a bomb"
  - "suicide instructions"
  - "child sexual abuse"
  - "制作炸弹"
  - "自杀方法"
  - "儿童色情"

InternalSecret: ${RPC_INTERNAL_SECRET}
