Name: assistant.rpc
ListenOn: 0.0.0.0:9024
Health: true
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9124
  EnableMetrics: true
  EnablePprof: false
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: assistant.rpc
ContentRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: content.rpc
UserRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: user.rpc
DataSource: "${DB_ASSISTANT}"
MaxMessageRunes: 2000
Safety:
  Enabled: true
  MaxScanRunes: 10000
  BlockedTerms:
  - "build a bomb"
  - "suicide instructions"
  - "child sexual abuse"
  - "制作炸弹"
  - "自杀方法"
  - "儿童色情"

InternalSecret: ${RPC_INTERNAL_SECRET}
