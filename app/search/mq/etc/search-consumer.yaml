Name: search-index-consumer
Prometheus:
  Host: 0.0.0.0
  Port: 9133
  Path: /metrics

MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "search-service-group"
  Topic: "post-create"
  Tag: "default"
  ConsumeOrder: false
  MaxReconsumeTimes: 8

ES:
  Addresses:
    - "${ES_ADDRESS}"
  Index: "xbh_posts"
  Username: "${ES_USERNAME}"
  Password: "${ES_PASSWORD}"

ContentRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: content.rpc

Rebuild:
  PageSize: 50
  TimeoutSeconds: 900

# 服务间内部鉴权共享密钥（HMAC），全服务一致
InternalSecret: ${RPC_INTERNAL_SECRET}
