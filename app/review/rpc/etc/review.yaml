Name: review.rpc
ListenOn: 0.0.0.0:9027
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9127
  EnableMetrics: true
  EnablePprof: false
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: review.rpc

DataSource: "${DB_REVIEW}"
PolicyVersion: ads-2026-10-01

MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "review-outbox-producer"
  Retry: 3
  SendTimeout: 3000
Outbox:
  BatchSize: 100
  PollIntervalMs: 200
  LeaseMs: 30000
  BaseBackoffMs: 1000
  MaxBackoffMs: 60000
  MaxAttempts: 20

# 服务间内部鉴权共享密钥（HMAC），全服务一致
InternalSecret: ${RPC_INTERNAL_SECRET}
