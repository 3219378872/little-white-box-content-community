Name: message.rpc
ListenOn: 0.0.0.0:9092
Middlewares:
  StatConf:
    # REL-022：不记录私信正文与通知内容。
    IgnoreContentMethods:
      - /message.MessageService/SendMessage
      - /message.MessageService/GetMessages
      - /message.MessageService/GetConversations
      - /message.MessageService/SendNotification
      - /message.MessageService/GetNotifications
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: message.rpc
DataSource: "${DB_MESSAGE}"
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
MediaRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: media.rpc
Redis:
  Host: 127.0.0.1:6379
  Pass: "${REDIS_PASS}"
  Type: node
  Key: "message"

# 服务间内部鉴权共享密钥（HMAC），全服务一致
InternalSecret: ${RPC_INTERNAL_SECRET}
