Name: behavior-log-consumer
Prometheus:
  Host: 0.0.0.0
  Port: 9131
  Path: /metrics

MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "behavior-log-service-group"
  Topic: "user-behavior-v2"
  Tag: ""
  ConsumeOrder: false
  MaxReconsumeTimes: 8

ClickHouseDSN: "${CLICKHOUSE_DSN}"

Redis:
  Host: "${REDIS_HOST}"
  Type: node
  Pass: "${REDIS_PASSWORD}"

DedupTTL: 7776000
# REL-020：每日聚合去标识结果到 daily_aggregates（保留 365 天）。
AggregateIntervalSeconds: 86400
AggregateBackfillDays: 1
