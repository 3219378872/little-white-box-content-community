RestConf:
  Name: gateway
  Host: 0.0.0.0
  Port: 8888
  # go-zero 的 REST Log 中间件会在 JWT/5xx 路径 dump 完整请求（含凭据和正文）。
  # Gateway 改用只记录方法、路径、状态和耗时的 SafeAccessLog。
  Middlewares:
    Log: false
  # 框架默认 1MiB 会先于上传 handler 的 10MB MaxBytesReader 拒绝大图，
  # 与 image 上传上限对齐（video 走 gRPC 不受此限制）。
  MaxBytes: 10485760
Auth:
  AccessSecret: ${JWT_SECRET_KEY}
  # 双令牌：访问令牌 30 分钟，客户端凭刷新令牌换新（user rpc 签发）
  AccessExpire: 1800

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
ContentRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: content.rpc
MediaRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: media.rpc
InteractionRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: interaction.rpc
BehaviorRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: behavior.rpc
FeedRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: feed.rpc
MessageRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: message.rpc
SearchRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: search.rpc
AssistantRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: assistant.rpc

# 服务间内部鉴权共享密钥（HMAC），全服务一致
InternalSecret: ${RPC_INTERNAL_SECRET}
