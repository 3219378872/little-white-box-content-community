Name: content.rpc
ListenOn: 0.0.0.0:8088
Middlewares:
  StatConf:
    # REL-022：不记录社区正文、评论或私信相关请求内容。
    IgnoreContentMethods:
      - /content.ContentService/CreatePost
      - /content.ContentService/UpdatePost
      - /content.ContentService/GetPost
      - /content.ContentService/GetPostList
      - /content.ContentService/GetUserPosts
      - /content.ContentService/GetPostsByIds
      - /content.ContentService/CreateComment
      - /content.ContentService/DeleteComment
      - /content.ContentService/GetCommentList
      - /content.ContentService/GetPostsByTag
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9188
  EnableMetrics: true
  EnablePprof: false
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: content.rpc
Redis:
  Host: 127.0.0.1:6379
  Pass: "${REDIS_PASSWORD}"
  Type: node
  Key: content
DataSource: "${DB_CONTENT}"
MediaRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: media.rpc
MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "content-producer-group"
  Retry: 3
  SendTimeout: 3000
Outbox:
  BatchSize: 100
  PollIntervalMs: 200
  LeaseMs: 30000
  BaseBackoffMs: 1000
  MaxBackoffMs: 60000
  MaxAttempts: 20
Log:
  Level: info

# 服务间内部鉴权共享密钥（HMAC），全服务一致
InternalSecret: ${RPC_INTERNAL_SECRET}
