Name: content.rpc
ListenOn: 0.0.0.0:8088
DevServer:
  Enabled: true
  Host: 0.0.0.0
  Port: 9188
  EnableMetrics: true
  EnablePprof: false
Etcd:
  Hosts:
  - 127.0.0.1:2379
  Key: content.rpc
Redis:
  Host: 127.0.0.1:6379
  Pass: "${REDIS_PASS}"
  Type: node
  Key: content
DataSource: "${DB_CONTENT}"
DtmServer: "etcd://127.0.0.1:2379/dtmservice"
ContentBusiServer: "etcd://127.0.0.1:2379/content"
FeedBusiServer: "etcd://127.0.0.1:2379/feed.rpc"
MediaRpc:
  Etcd:
    Hosts:
    - 127.0.0.1:2379
    Key: media.rpc
MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "content-producer-group"
  Retry: 3
  SendTimeout: 3000
Outbox:
  BatchSize: 100
  PollIntervalMs: 200
  LeaseMs: 30000
  BaseBackoffMs: 1000
  MaxBackoffMs: 60000
  MaxAttempts: 20
Log:
  Level: info
