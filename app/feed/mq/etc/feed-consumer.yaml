DataSource: "${DB_FEED}"
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "feed-service-group"
  Topic: "post-create"
  Tag: "default"
  ConsumeOrder: false
  MaxReconsumeTimes: 8
BigVThreshold: 10000
FanoutBatchSize: 500

# 服务间内部鉴权共享密钥（HMAC），全服务一致
InternalSecret: ${RPC_INTERNAL_SECRET}
