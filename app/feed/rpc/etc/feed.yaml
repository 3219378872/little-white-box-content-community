Name: feed.rpc
ListenOn: 0.0.0.0:9093
Middlewares:
  StatConf:
    IgnoreContentMethods:
      - /feed.FeedService/GetFollowFeed
      - /feed.FeedService/GetRecommendFeed
      - /feed.FeedService/PushToInbox
      - /feed.FeedService/FanoutPost
Etcd:
  Hosts:
    - 127.0.0.1:2379
  Key: feed.rpc
DataSource: "${DB_FEED}"
Redis:
  Host: 127.0.0.1:6379
  Pass: "${REDIS_PASSWORD}"
  Type: node
  Key: feed
UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
ContentRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: content.rpc
RecommendRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: recommend.rpc
CursorSecret: "${FEED_CURSOR_SECRET}"
MQ:
  NameServer: "${MQ_NAMESERVER}"
  GroupName: "feed-service-group"
  Topic: 'post-create'
  Tag: 'default'
  ConsumeOrder: false
  MaxReconsumeTimes: 8
BigVThreshold: 10000
FanoutBatchSize: 500

# 服务间内部鉴权共享密钥（HMAC），全服务一致
InternalSecret: ${RPC_INTERNAL_SECRET}
