name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: make vet
      - name: Install golangci-lint (built with project Go toolchain)
        # The prebuilt golangci-lint binaries are built with an older Go and
        # refuse a config targeting go 1.26.1, so build it from source with the
        # go version setup-go installed from go.mod.
        env:
          GOTOOLCHAIN: go1.26.1
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.6.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: golangci-lint (all go.work modules)
        run: make lint ARGS='--timeout 5m'
      - name: Engineering lint
        run: make engineering-lint

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go tests (race + cover, all modules)
        env:
          TEST_JSON_DIR: ${{ github.workspace }}/.artifacts/test-json
        run: make test
      - name: Layered coverage gate
        run: make coverage
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence
          path: .artifacts/

  critical-integration:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Critical MySQL and Redis integration tests
        run: make integration-critical

  nightly-full-integration:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Full integration lifecycle
        env:
          INTEGRATION_PARALLELISM: "1"
        run: make integration-all
      - name: Bounded native fuzz tests
        run: make fuzz
